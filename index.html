<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khám Phá Du Lịch Việt Nam</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Vẻ Đẹp Đất Nước Việt Nam</h1>
        <p>Hành trình khám phá những điểm đến tuyệt đẹp, danh lam thắng cảnh và di sản văn hóa trải dài từ Bắc vào Nam.</p>
    </header>

    <main>
        <div class="grid">
            <figure>
                <img src="images/ha-long.jpg" alt="Vịnh Hạ Long với hàng ngàn đảo đá vôi kỳ vĩ trên làn nước xanh ngọc">
                <figcaption>1. Vịnh Hạ Long - Kỳ quan thiên nhiên thế giới tại Quảng Ninh.</figcaption>
            </figure>

            <figure>
                <img src="images/ha-noi.jpg" alt="Phố cổ Hà Nội bình yên vào buổi sáng sớm">
                <figcaption>2. Hà Nội - Thủ đô ngàn năm văn hiến với nét đẹp cổ kính.</figcaption>
            </figure>

            <figure>
                <img src="images/hcm.jpg" alt="Thành phố Hồ Chí Minh hiện đại lung linh về đêm">
                <figcaption>3. TP. Hồ Chí Minh - Trái tim kinh tế sôi động và hiện đại.</figcaption>
            </figure>

            <figure>
                <img src="images/hoi-an.jpg" alt="Phố cổ Hội An rực rỡ sắc màu với những ngọn đèn lồng treo khắp các con phố">
                <figcaption>4. Hội An - Di sản văn hóa thế giới với những đèn lồng rực rỡ.</figcaption>
            </figure>

            <figure>
                <img src="images/da-nang.jpg" alt="Cầu Rồng Đà Nẵng phun lửa nổi tiếng bắc qua sông Hàn">
                <figcaption>5. Đà Nẵng - Thành phố đáng sống nhất Việt Nam.</figcaption>
            </figure>

            <figure>
                <img src="images/ninh-binh.jpg" alt="Ninh Bình với những dòng sông uốn lượn quanh dãy núi đá vôi">
                <figcaption>6. Ninh Bình - Hạ Long trên cạn với cảnh sắc sơn thủy hữu tình.</figcaption>
            </figure>

            <figure>
                <img src="images/hue.jpg" alt="Cố đô Huế trầm mặc bên dòng sông Hương mộng mơ">
                <figcaption>7. Cố đô Huế - Vùng đất di sản đậm đà bản sắc lịch sử.</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>&copy; Du lịch Việt Nam</p>
    </footer>
</body>
</html>
